pluginManagement {
    repositories {
        google()
        // Google-hosted Central mirror avoids shared CI runner rate limits.
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
        maven { url = uri('https://api.xposed.info/') }
    }
}
rootProject.name = 'Pixel-Soli-MotionSense'
include ':adapter', ':settings', ':settingslib', ':stubs', ':doze-overlay'
project(':settingslib').projectDir = file('settings/settingslib')

