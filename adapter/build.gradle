plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.mrmetatron.soli.adapter'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.mrmetatron.soli.adapter'
        minSdk 34
        targetSdk 36
        versionCode rootProject.ext.soliVersionCode as int
        versionName rootProject.ext.soliVersionName
        buildConfigField 'String', 'SOLI_CERT_SHA256', '"' + rootProject.ext.soliCertSha256 + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Keep the Xposed entry point and reflection targets unchanged.
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
}
