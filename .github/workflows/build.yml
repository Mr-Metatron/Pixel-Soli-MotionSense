name: Build Motion Sense

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the current version as a GitHub prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      notes: ${{ steps.release-metadata.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install fixed Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and verify the single module
        env:
          SOLI_SIGNING_KEY: ${{ secrets.SOLI_SIGNING_KEY }}
        run: bash scripts/build.sh
      - name: Upload flashable module
        uses: actions/upload-artifact@v4
        with:
          name: soli_motion-${{ github.sha }}
          path: dist/soli_motion-*.zip
          compression-level: 0
          if-no-files-found: error
      - name: Prepare release metadata
        id: release-metadata
        shell: bash
        run: |
          version=$(sed -n 's/^soliVersionName=//p' gradle.properties)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo 'Tag must match soliVersionName in gradle.properties.' >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo 'notes<<SOLI_RELEASE_NOTES'
            cat .build/release-notes.md
            echo 'SOLI_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.release)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main'
          && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified module from this build
        uses: actions/download-artifact@v4
        with:
          name: soli_motion-${{ github.sha }}
          path: dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_NOTES: ${{ needs.build.outputs.notes }}
        shell: bash
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "v${RELEASE_VERSION}" "dist/soli_motion-${RELEASE_VERSION}.zip" --target "$GITHUB_SHA" \
            --title "Pixel Soli Motion Sense ${RELEASE_VERSION}" --prerelease --notes-file release-notes.md
